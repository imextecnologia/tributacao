name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo: a data do último commit ordena os arquivos

      - name: Injetar chave do Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Secret GEMINI_API_KEY não configurado; o site vai pedir a chave no navegador."
          else
            sed -i "s|__GEMINI_API_KEY__|${GEMINI_API_KEY}|" index.html
          fi

      - name: Listar arquivos de pdf/ e xml/
        run: node scripts/gerar-arquivos.js --html

      # versão nos links de CSS/JS para o navegador não usar a cópia antiga do cache
      - name: Versionar CSS e JS
        run: sed -i "s|href=\"site.css\"|href=\"site.css?v=${GITHUB_SHA::7}\"|; s|src=\"tema.js\"|src=\"tema.js?v=${GITHUB_SHA::7}\"|" index.html tributos.html

      - name: Montar site
        run: |
          mkdir -p _site pdf xml
          cp -r index.html tributos.html site.css tema.js arquivos.json logo.svg imex-rodape.svg og-image.png sitemap.xml favicon.ico favicon-32.png apple-touch-icon.png .nojekyll exemplos pdf xml _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
