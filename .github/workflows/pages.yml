name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Injetar chave do Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Secret GEMINI_API_KEY não configurado; o site vai pedir a chave no navegador."
          else
            sed -i "s|__GEMINI_API_KEY__|${GEMINI_API_KEY}|" index.html
          fi

      - name: Montar site
        run: |
          mkdir _site
          cp -r index.html logo.svg favicon.ico favicon-32.png apple-touch-icon.png .nojekyll exemplos _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
