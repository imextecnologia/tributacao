name: Buscar PDF da Fecombustíveis e preços da ANP

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas (00:00 e 12:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: buscar-pdf
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Procurar PDF novo
        id: busca
        run: node scripts/buscar-pdf.js

      # preço médio de bomba (média Brasil) do levantamento semanal da ANP, usado nas % do resumo;
      # se a ANP falhar, segue sem atualizar os preços
      - name: Procurar preços novos da ANP
        id: precos
        continue-on-error: true
        run: node scripts/buscar-precos.js

      - name: Commit do PDF e dos preços
        if: steps.busca.outputs.novo != '' || steps.precos.outputs.novo != ''
        env:
          ARQUIVO: ${{ steps.busca.outputs.novo }}
          SEMANA: ${{ steps.precos.outputs.novo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg=""
          if [ -n "$ARQUIVO" ]; then git add "pdf/$ARQUIVO"; msg="PDF da Fecombustíveis: $ARQUIVO"; fi
          if [ -n "$SEMANA" ]; then git add precos.json; msg="${msg:+$msg; }Preços ANP: semana $SEMANA"; fi
          git commit -m "$msg"
          git push

      # push feito com GITHUB_TOKEN não dispara outros workflows; publica o site explicitamente
      - name: Publicar site
        if: steps.busca.outputs.novo != '' || steps.precos.outputs.novo != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
